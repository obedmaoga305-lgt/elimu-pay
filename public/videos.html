<script>
  async function loadVideos() {
    try {
      // Direct public fetch, no auth headers required
      const res = await fetch('/api/videos');
const videos = await res.json();

      // Update UI
      document.getElementById('statVideos').textContent = videos.length;
      renderVideos(videos);
    } catch (e) {
      console.error("Load error:", e);
    }
  }

  function renderVideos(videos) {
    const grid = document.getElementById('videoGrid');
    if (!videos.length) {
      grid.innerHTML = '<div class="empty">No lessons available.</div>';
      return;
    }

    grid.innerHTML = videos.map(v => `
      <div class="video-card" onclick="openVideo('${v.id}', '${encodeURIComponent(v.title)}', '${v.url}', '${v.subject || ''}', '${v.duration || 0}')">
        <div class="video-thumb">
          <img src="${v.thumbnail || 'https://via.placeholder.com/640x360'}" alt="${v.title}">
          <span class="subject-chip">${v.subject || 'Lesson'}</span>
        </div>
        <div class="video-info">
          <h3>${v.title}</h3>
        </div>
      </div>
    `).join('');
  }

  loadVideos();
</script>
